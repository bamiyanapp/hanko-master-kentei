<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景（maskable icon用に全面を単色で塗る、manifest.jsonのbackground_colorと合わせる） -->
  <rect width="512" height="512" fill="#FBF7EF"/>

  <!-- トップページの丸背景（bg-red-100 / border-red-200）と揃えた円 -->
  <circle cx="256" cy="256" r="200" fill="#fee2e2" stroke="#fecaca" stroke-width="10"/>

  <!-- 💮（花丸） -->
  <text x="256" y="288" text-anchor="middle" dominant-baseline="middle"
        font-family="'Noto Color Emoji'" font-size="260">💮</text>
</svg>
