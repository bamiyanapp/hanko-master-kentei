<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="inkTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 背景（maskable icon用に全面を単色で塗る） -->
  <rect width="512" height="512" fill="#FBF7EF"/>

  <!-- 朱肉の滲みを表現する外側のぼかし円 -->
  <circle cx="256" cy="256" r="196" fill="#C1361F" opacity="0.18" filter="url(#inkTexture)"/>

  <!-- はんこ本体（朱色の円） -->
  <circle cx="256" cy="256" r="176" fill="#D93A21" filter="url(#inkTexture)"/>

  <!-- 内側の輪（本体より少し暗い朱色） -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#A82A16" stroke-width="10" opacity="0.55" filter="url(#inkTexture)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#A82A16" stroke-width="6" opacity="0.4" filter="url(#inkTexture)"/>

  <!-- 「印」の文字（白抜き） -->
  <text x="256" y="288" text-anchor="middle"
        font-family="'IPAGothic','IPAPGothic',sans-serif"
        font-size="200" font-weight="700" fill="#FBF7EF"
        filter="url(#inkTexture)">印</text>
</svg>
