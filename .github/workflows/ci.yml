name: CI
run-name: CI ${{ github.event.pull_request.title }}

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.3.0
    with:
      node_version: "24"
      workspaces: true
      enable_duplication_check: true
      duplication_threshold: 5
      coverage_threshold: 70
      enable_standards_check: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
