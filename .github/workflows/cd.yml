name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  release:
    name: Release
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-cd.yml@v2.7.4
    with:
      enable_release: true
      enable_shared_release_config: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  build-and-deploy-frontend:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          submodules: true
      - name: 🏷️ ビルド情報を環境変数へ設定
        run: |
          echo "NEXT_PUBLIC_APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
      - name: 🚀 Build and deploy to GitHub Pages
        id: deployment
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v2.7.4
        with:
          working-directory: frontend
          node-version: "24"
          artifact-path: frontend/out
          workspaces: true
      - name: Show GitHub Pages URL
        run: |
          echo "Pages URL: ${{ steps.deployment.outputs.page-url }}"

  deploy-backend:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: 🚀 Deploy Backend (OSLS)
        uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v2.7.4
        with:
          working-directory: backend
          node-version: "24"
          deploy-command: npx osls deploy
          workspaces: true
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: 🌱 Seed Database
        working-directory: backend
        run: node seed.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
