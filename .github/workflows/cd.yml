name: CD
run-name: CD ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: 🚀 Build and deploy to GitHub Pages
        id: deployment
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v2.5.1
        with:
          working-directory: frontend
          node-version: "24"
          artifact-path: frontend/out
          workspaces: true
      - name: Show GitHub Pages URL
        run: |
          echo "Pages URL: ${{ steps.deployment.outputs.page-url }}"

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: 🚀 Deploy Backend (OSLS)
        uses: bamiyanapp/dev-standards/.github/actions/deploy-serverless@v1.23.0
        with:
          working-directory: backend
          node-version: "24"
          deploy-command: npx osls deploy
          workspaces: true
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: 🌱 Seed Database
        working-directory: backend
        run: node seed.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
